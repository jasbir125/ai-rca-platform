{{/*
  Baseline Secret for local/kind use only. Real deployments should point Postgres
  credentials at AWS Secrets Manager (e.g. via the External Secrets Operator) instead
  of Helm-managed values — see docs/aws-setup.md. Nothing here has a committed default;
  postgres.password must be supplied via --set or an uncommitted secrets values file.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: rca-platform-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | default "rca" | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | required "postgres.password must be set via --set or an uncommitted secrets values file - never commit a real value here" | quote }}
