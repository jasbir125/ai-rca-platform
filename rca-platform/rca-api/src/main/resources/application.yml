server:
  port: ${RCA_API_PORT:8090}

spring:
  application:
    name: rca-api

  datasource:
    # currentSchema also sets the session search_path; "public" must stay on it too or
    # pgvector's HNSW operator classes (registered in public) become invisible and
    # PgVectorStore's index creation fails with "operator class ... does not exist".
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:rca_platform}?currentSchema=rca,public
    username: ${POSTGRES_USER:rca}
    password: ${POSTGRES_PASSWORD:rca_local_dev_only}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: rca

  flyway:
    schemas: rca
    default-schema: rca
    create-schemas: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${LLM_MODEL:qwen3.5:latest}
          num-ctx: 8192
      embedding:
        options:
          model: ${EMBEDDING_MODEL:nomic-embed-text}
      init:
        pull-model-strategy: never
    vectorstore:
      pgvector:
        schema-name: rag
        initialize-schema: true

ai:
  provider: ${AI_PROVIDER:OLLAMA}

observability:
  prometheus:
    url: ${PROMETHEUS_URL:http://localhost:9090}
  loki:
    url: ${LOKI_URL:http://localhost:3100}
  jaeger:
    url: ${JAEGER_URL:http://localhost:16686}

rag:
  knowledge-base-path: ${RAG_KNOWLEDGE_BASE_PATH:../knowledge}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app:
  environment: ${APP_ENVIRONMENT:local}
  version: ${APP_VERSION:1.0.0}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${app.environment}

logging:
  level:
    root: INFO
    com.airca: INFO
