server:
  port: ${ORDER_SERVICE_PORT:8081}

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:rca_platform}?currentSchema=order_service
    username: ${POSTGRES_USER:rca}
    password: ${POSTGRES_PASSWORD:rca_local_dev_only}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: order_service

  flyway:
    schemas: order_service
    default-schema: order_service
    create-schemas: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false

payment:
  service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8082}
  call-timeout-ms: ${PAYMENT_CALL_TIMEOUT_MS:3000}

app:
  environment: ${APP_ENVIRONMENT:local}
  version: ${APP_VERSION:1.0.0}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${app.environment}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${TRACING_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    root: INFO
    com.airca: INFO
